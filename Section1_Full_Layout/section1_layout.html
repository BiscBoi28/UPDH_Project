<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Museum of Theft · Section 1 · Who Is the Thief? · Full layout mock-up</title>
<style>
  @font-face { font-family: "Diplomata SC"; src: url("assets/fonts/Diplomata_SC.ttf"); }
  @font-face { font-family: "Unna"; src: url("assets/fonts/Unna.ttf"); }
  @font-face { font-family: "Unna"; font-style: italic; src: url("assets/fonts/Unna_Italics.ttf"); }
  @font-face { font-family: "League Spartan"; src: url("assets/fonts/League_Spartan.ttf"); }
  @font-face { font-family: "Montserrat"; font-weight: 400; src: url("assets/fonts/Montserrat.ttf"); }
  @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/Montserrat_Semi-Bold.ttf"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/fonts/Montserrat_Bold.ttf"); }
  @font-face { font-family: "Roboto"; font-weight: 400; src: url("assets/fonts/Roboto.ttf"); }
  @font-face { font-family: "Roboto"; font-weight: 700; src: url("assets/fonts/Roboto_Bold.ttf"); }
  @font-face { font-family: "Noticia Text"; src: url("assets/fonts/Noticia_Text.ttf"); }
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins_Bold.ttf"); }

  html { font-size: 40px; }            /* 1rem = 1 cm at real size */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f1ea; font-family: "Segoe UI", Arial, sans-serif; color: #222; }
  .abs { position: absolute; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .shadow { box-shadow: .12rem .18rem .35rem rgba(0,0,0,.35); }
  .board { position: relative; width: 120rem; height: 90rem;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,.06) 0 .08rem, transparent .09rem) 0 0/.7rem .7rem,
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.08) 0 .06rem, transparent .07rem) 0 0/.5rem .5rem,
      #b98c5d;
    border: .9rem solid #5a4330; box-sizing: content-box; }
  .dark { background: #1f262e; color: #efe6d2; }
  .kicker { font-size: .39rem; letter-spacing: .08rem; text-transform: uppercase; font-weight: 600; }
  .note-ph { position:absolute; font-size:.28rem; color:#a33; background:rgba(255,255,255,.9);
    padding:.04rem .14rem; border:.03rem solid #a33; font-family:"Segoe UI",Arial; font-style:normal; font-weight:400; letter-spacing:0; line-height:1.25; }
  .ph-box { border:.05rem dashed #a33; color:#a33; font-family:"Segoe UI",Arial; font-size:.3rem; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3; padding:.2rem; }

  /* shared: owner / loss / law chips (from the Morning Journal status chips) */
  .chips { display:flex; gap:.25rem; align-items:center; flex-wrap:wrap; }
  .chip { font-family:"Montserrat"; font-weight:700; font-size:.42rem; letter-spacing:.04rem; padding:.12rem .32rem; border-radius:1rem; border:.05rem solid currentColor; line-height:1; }
  .chip.yes { color:#2f6b3a; background:#e6f0e2; }
  .chip.no  { color:#b3261e; background:#f8e2df; }
  .verdict { font-family:"Montserrat"; font-weight:700; font-size:.5rem; margin-left:.2rem; }

  /* ---- CASE 1 · Ordinary theft · incident report (Boy Scouts form structure) ---- */
  .rep { background:#fbfbf8; font-family:"Roboto",Arial,sans-serif; color:#1e2430; }
  .rep p { font-size:.72rem; line-height:1.45; margin-bottom:.36rem; }
  .rep .lt { font-weight:700; font-size:.54rem; line-height:1.25; }
  .rep .lm { font-size:.42rem; color:#1d3b6a; margin:.08rem 0 .12rem; }
  .rep .ld { font-size:.5rem; line-height:1.35; }
  .rep .cap { font-family:"Montserrat"; font-weight:700; font-size:.36rem; letter-spacing:.08rem; text-transform:uppercase; color:#1d3b6a; }
  .policeblue { background:#1d3b6a; color:#fff; }
  .stamp { font-family:"League Spartan","Montserrat"; font-weight:700; color:#b3261e; border:.12rem solid #b3261e; border-radius:.2rem; padding:.12rem .35rem; transform:rotate(-6deg); display:inline-block; letter-spacing:.05rem; }

  /* ---- CASE 2 · Kleptomania · Victorian (Claus Toys) ---- */
  .vic { background: linear-gradient(160deg,#f6efdf 0%,#f1e8d4 60%,#ebdfc6 100%); font-family:"Unna",Georgia,serif; color:#2b2a26; }
  .vic-frame { outline:.06rem solid #2f4a3a; outline-offset:-.45rem; }
  .orn { background:url("assets/ornament_band.png") repeat-x center/auto 100%; }
  .dip { font-family:"Diplomata SC",Georgia,serif; color:#2f4a3a; }
  .vic .kick { font-size:.4rem; letter-spacing:.14rem; text-transform:uppercase; color:#8a5a2e; }
  .vic p { font-size:.66rem; line-height:1.36; margin-bottom:.32rem; }
  .vic .lt { font-weight:700; font-size:.56rem; line-height:1.25; }
  .vic .lm { font-size:.44rem; color:#8a5a2e; margin:.08rem 0 .12rem; font-style:italic; }
  .vic .ld { font-size:.54rem; line-height:1.3; }

  /* ---- CASE 3 · Robin Hood · Morning Journal ---- */
  .jour { background:#efe4d0; font-family:"Noticia Text",Georgia,serif; color:#22343a; }
  .script { font-family:"French Script MT","Alex Brush","Segoe Script",cursive; color:#fff; text-shadow:0 0 .06rem rgba(31,59,68,.55), 0 .03rem .05rem rgba(0,0,0,.25); }
  .jour p { font-size:.62rem; line-height:1.45; margin-bottom:.32rem; }
  .jour .lt { font-weight:700; font-size:.5rem; line-height:1.25; }
  .jour .lm { font-size:.4rem; color:#8a6a3a; margin:.06rem 0 .1rem; font-style:italic; }
  .jour .ld { font-size:.46rem; line-height:1.32; }
  .jchip { font-family:"Montserrat"; font-weight:700; font-size:.34rem; letter-spacing:.04rem; padding:.1rem .25rem; border-radius:1rem; color:#fff; display:inline-block; line-height:1.1; text-align:center; }

  /* ---- CASE 4 · Benin · museum archive, bronze ---- */
  .arc { background:#f6f1e8; font-family:"Noticia Text",Georgia,serif; color:#2e2118; }
  .bronze { background:#7a4e26; color:#f6ead8; }
  .arc p { font-size:.58rem; line-height:1.43; margin-bottom:.3rem; }
  .arc .lt { font-weight:700; font-size:.5rem; line-height:1.25; }
  .arc .lm { font-size:.4rem; color:#7a4e26; margin:.06rem 0 .1rem; font-style:italic; }
  .arc .ld { font-size:.46rem; line-height:1.32; }
  .arc .cap { font-family:"Montserrat"; font-weight:700; font-size:.3rem; letter-spacing:.1rem; text-transform:uppercase; color:#7a4e26; }

  .view { position:relative; overflow:hidden; background:#f4f1ea; }
  .stage { position:absolute; left:0; top:0; transform-origin:0 0; }
  .vcap { font-size:18px; padding:10px 16px; font-weight:600; color:#333; }
  .dim { position:absolute; font-size:1.1rem; color:#333; font-family:"Segoe UI",Arial; }
  .anno { position:absolute; background:#c0392b; color:#fff; border-radius:.8rem; min-width:1.5rem; height:1.5rem; padding:0 .28rem;
    font-size:.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:"Segoe UI",Arial; box-shadow:0 .05rem .15rem rgba(0,0,0,.4); z-index:5; }
  .dnote { position:absolute; font-size:.42rem; color:#3a2a1a; line-height:1.35; font-family:"Segoe UI",Arial; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const R = 40;
const COLW = 28.5;
const COLX = [1, 30.83, 60.67, 90.5];

/* ============================================================
   TEXT (Phase 4)
   ============================================================ */
const INTRO = [
  "Most people can picture a thief: someone who takes what belongs to another, without permission. The thief is usually the easiest person in the story to identify. The label seems to follow from the act. This section tests that idea through four cases.",
  "Each case is checked against three conditions: an owner, a loss, and a law that names the taking as a crime. In an ordinary theft, all three are present, and so is the thief. Each case that follows keeps the taking in plain sight and changes something else.",
  "Two women take the same goods from the same counter, but only one is called a thief. An outlaw robs travellers at knifepoint, and centuries of retelling turn him into a hero. A palace is looted, and its treasures pass through so many lawful hands that no single person seems to have taken them.",
  "The taking stays visible throughout. What changes is who the taker is, who the victim is, where the goods end up, and how much time has passed. The label ‘thief’ turns out to depend on more than the act."
];
const ORD = [
  "On a crowded street, a hand slips into a pocket and leaves with a wallet. The owner notices only later. A complaint is filed, and if the pickpocket is caught, the law takes its course. Cash, cards and jewellery are taken the same way.",
  "In India, that law is Section 303 of the Bharatiya Nyaya Sanhita, 2023. It defines theft as dishonestly taking someone’s movable property out of their possession, without consent. The pickpocket’s act fits every part of that definition.",
  "Owner, loss, law: all three are present, and the thief is obvious. Note the word <i>movable</i>. Under this section, land cannot be stolen at all — a limit Section 3 of this exhibition returns to."
];
const KLE = [
  "From the 1870s, large department stores spread through American and British cities. Goods sat on open counters, and shoppers could handle them freely. Shoplifting rose with them. Many of those caught were middle-class women, the stores’ best customers, taking things they could easily afford. Doctors offered an explanation. Since the early nineteenth century, they had described ‘kleptomania’, an urge to steal. Applied to these women, it turned a crime into an illness. Stores, unwilling to lose respectable customers, often settled such cases quietly.",
  "The diagnosis did not reach everyone. In New York in 1882, Ellen Sardy was caught in a Sixth Avenue department store with three pairs of hosiery and five pieces of silk. Her lawyer admitted the theft and asked for clemency because she had been ‘of weak mind’. The court accepted it and she went free. Historian Elaine Abelson, who recovered the case, writes that only middle-class women seemed to suffer from kleptomania: ‘stealing by members of other classes was simple theft’.",
  "Owner and loss are identical in both cases, and so is the law. Only the person differs. The act did not decide the label; class did."
];
const ROB = [
  "Robin Hood is first mentioned in the 1370s, when the poem <i>Piers Plowman</i> refers to ‘rhymes of Robin Hood’. The poem says nothing about who he was or what he did; it tells us only that such rhymes already circulated.",
  "The earliest surviving ballads, from about 1450, describe an outlaw living in the forest with a band of followers, in conflict with a corrupt sheriff. He stops wealthy travellers on the road and takes what they carry at the point of a weapon. The ballads are frank about the violence, and they are also frank about what they do not say: they do not describe him giving to the poor. That line is first set down plainly by John Stow in 1592, roughly a century after <i>A Gest of Robyn Hode</i>, and it is the version that has lasted.",
  "Owner, loss and law are all present. The travellers owned what they carried, they lost it, and Robin lived outside the law’s protection as a declared outlaw. Nothing is missing. What changed was not the robbery but the story told about it afterwards — and each retelling gave the robberies a better reason."
];
const BEN = [
  "In 1897, a British punitive expedition captured Benin City, burned the royal palace and removed thousands of brass plaques, ivories and commemorative heads. Many were auctioned in London to defray the cost of the expedition itself. Others entered Western museums over the following decades through purchase, donation and transfer. These were not currency or raw material: the plaques were the palace’s own record of its dynasty, an archive kept in place.",
  "Owner and loss are not in doubt. What is missing is the third condition. Each transfer was lawful where it took place, and every person in the chain can point to someone earlier. With no act the law named as a crime, the chain has no obvious thief — only a sequence of people who each acted correctly, and a benefit that passed down the line with the objects.",
  "The question has since moved from who took the objects to who holds them now. In 2022 the Smithsonian transferred ownership of 29 objects to Nigeria’s National Commission for Museums and Monuments. In 2023 Nigeria’s outgoing president declared the Oba of Benin the owner of returned bronzes, and who should hold, keep and display them within Nigeria remains disputed. Returning an object settles ownership. It does not settle who is answerable for how it left."
];

/* ============================================================
   HELPERS
   ============================================================ */
function qrBlock(size, seed) {
  let s = seed || 12345, cells = ""; const n = 21, c = size/n;
  const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) {
    const finder = (i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7); let on;
    if (finder) { const ii=i>13?i-14:i, jj=j>13?j-14:j; on = (ii==0||ii==6||jj==0||jj==6)||(ii>=2&&ii<=4&&jj>=2&&jj<=4); }
    else on = rnd()>0.52;
    if (on) cells += `<rect x="${j*c}" y="${i*c}" width="${c+.01}" height="${c+.01}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}rem" height="${size}rem"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#111">${cells}</g></svg>`;
}
function greyLines(n, gap, h, col) { let o=""; for (let i=0;i<n;i++) o += `<div style="height:${h}rem;margin-bottom:${gap}rem;width:${i%5==4?60:100}%;background:${col||'rgba(60,50,40,.26)'}"></div>`; return o; }
function tag(n, x, y) { return `<div class="anno" style="left:${x}rem;top:${y}rem">${n}</div>`; }
function figure(fill, x, y, h, skirt) { // simple standing figure for storyboards
  return `<svg class="abs" style="left:${x}rem;top:${y}rem;width:${h*0.5}rem;height:${h}rem" viewBox="0 0 50 100">
    <circle cx="25" cy="12" r="9" fill="${fill}"/>${skirt?`<path d="M14 24 H36 L44 96 H6 Z" fill="${fill}"/>`:`<path d="M13 24 H37 V62 H33 V96 H27 V64 H23 V96 H17 V62 H13 Z" fill="${fill}"/>`}</svg>`;
}
function conditions(o,l,w,verdict){ const c=(t,ok)=>`<span class="chip ${ok?'yes':'no'}">${t} ${ok?'✓':'✗'}</span>`;
  return `<div class="chips">${c("OWNER",o)}${c("LOSS",l)}${c("LAW",w)}<span class="verdict">${verdict}</span></div>`; }
function qrStrip(X, y, bg, fg, accent, font, text, seed) {
  return `<div class="abs shadow" style="left:${X}rem;top:${y}rem;width:${COLW}rem;height:4.6rem;background:${bg};color:${fg};display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;font-family:${font}">
    <div style="padding:.1rem;background:#fff;flex:none">${qrBlock(3.7,seed)}</div>
    <div style="font-size:.52rem;line-height:1.35">${text}</div></div>`;
}
function leaf(x,y,rot,scale){ return `<svg class="abs" style="left:${x}rem;top:${y}rem;width:${2.2*scale}rem;height:${1.4*scale}rem;transform:rotate(${rot}deg)" viewBox="0 0 44 28">
  <path d="M2 14 H42" stroke="#1f3b44" stroke-width="1.2"/>${[8,16,24,32].map(x=>`<ellipse cx="${x}" cy="8" rx="4" ry="2" transform="rotate(-35 ${x} 8)" fill="#1f3b44"/><ellipse cx="${x+3}" cy="20" rx="4" ry="2" transform="rotate(35 ${x+3} 20)" fill="#1f3b44"/>`).join("")}</svg>`; }

/* ============================================================
   CASE 1 · ORDINARY THEFT  (incident report)
   ============================================================ */
function colOrdinary(X) {
  const field = (k, v, ok) => `<div style="display:flex;border-bottom:.04rem solid #c9cfd9;padding:.3rem 0;align-items:baseline">
    <div class="cap" style="width:6.6rem;flex:none">${k}</div><div style="flex:1;font-size:.58rem">${v}</div>
    ${ok===undefined?'':`<div style="font-size:.5rem;font-weight:700;color:${ok?'#2f6b3a':'#b3261e'}">${ok?'✓':'✗'}</div>`}</div>`;
  return `
  <!-- O1 panel -->
  <div class="abs rep shadow" style="left:${X}rem;top:11.5rem;width:${COLW}rem;height:26rem;overflow:hidden">
    <div style="display:flex;height:4.3rem">
      <div class="policeblue" style="width:4.3rem;display:flex;align-items:center;justify-content:center;font-family:'League Spartan';font-size:1.6rem">1</div>
      <div style="flex:1;padding:.6rem .9rem 0;border-bottom:.08rem solid #1d3b6a">
        <div class="cap">Section 1 · Case 1</div>
        <div style="font-family:'League Spartan';font-weight:700;font-size:.95rem;line-height:1.05;margin-top:.2rem">ORDINARY THEFT</div></div>
    </div>
    <div style="padding:.5rem 1.1rem 0">
      <div style="font-size:.48rem;color:#1d3b6a;font-weight:700;margin-bottom:.45rem">A wallet, taken on a crowded street · Present day</div>
      ${ORD.map(p=>`<p>${p}</p>`).join("")}
    </div>
    <div class="abs" style="left:1.1rem;right:1.1rem;bottom:.8rem;border-top:.05rem dashed #1d3b6a;padding-top:.35rem">${conditions(true,true,true,"→ Thief: obvious")}</div>
  </div>

  <!-- O2 BNS 303 -->
  <div class="abs rep shadow" style="left:${X}rem;top:39rem;width:${COLW}rem;height:12.6rem;padding:.6rem .9rem">
    <div class="cap">Printed extract · Government of India</div>
    <div style="font-family:'League Spartan';font-weight:700;font-size:.62rem;margin:.12rem 0 .3rem">BHARATIYA NYAYA SANHITA, 2023 · SECTION 303(1)</div>
    <div style="position:relative;background:#fff;border-left:.18rem solid #1d3b6a;padding:.35rem .5rem;font-family:'Noticia Text',serif;font-size:.66rem;line-height:1.45">
      “Whoever, intending to take dishonestly any <span style="background:#fde68a;font-weight:700">movable</span> property out of the possession of any person without that person’s consent, moves that property in order to such taking, is said to commit theft.”
      <div class="note-ph" style="right:.1rem;bottom:-.35rem">check wording against the official Gazette text</div></div>
    <div style="margin-top:.55rem">
      <div class="lt">Section 303, Bharatiya Nyaya Sanhita</div>
      <div class="lm">2023 · Printed extract · Government of India</div>
      <div class="ld">India’s criminal code defines theft as dishonestly taking movable property from someone’s possession without consent. Movable is the key word: under this section, land cannot be stolen.</div></div>
  </div>

  <!-- O3 incident report -->
  <div class="abs rep shadow" style="left:${X}rem;top:53.1rem;width:${COLW}rem;height:19.4rem;overflow:hidden">
    <div class="policeblue" style="padding:.35rem .8rem;display:flex;justify-content:space-between;align-items:center">
      <div style="font-family:'League Spartan';font-weight:700;font-size:.62rem;letter-spacing:.04rem">INCIDENT REPORT</div>
      <div style="font-size:.32rem;letter-spacing:.06rem">CASE 1 · FORM MADE FOR THIS EXHIBITION</div></div>
    <div style="padding:.35rem .8rem">
      ${field("Place / time","A crowded street, present day")}
      ${field("Property","Wallet, cash, cards, jewellery: <b>movable</b>")}
      ${field("Owner","Known: the person whose pocket it was",true)}
      ${field("Loss","The owner no longer has it",true)}
      ${field("Consent","None given",true)}
      ${field("Law","Theft, BNS Section 303",true)}
      ${field("Suspect","A pickpocket")}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.45rem">
        <div style="font-size:.46rem;color:#555;font-style:italic;width:15rem">Every later case in this section is checked against the same three lines: owner, loss, law.</div>
        <div class="stamp" style="font-size:.82rem">THIEF: OBVIOUS</div></div>
    </div>
  </div>

  <!-- O4 how to read -->
  <div class="abs rep shadow" style="left:${X}rem;top:74.1rem;width:${COLW}rem;height:8.4rem;padding:.55rem .8rem;border-top:.25rem solid #1d3b6a">
    <div style="font-family:'League Spartan';font-weight:700;font-size:.55rem;margin-bottom:.25rem">HOW TO READ THIS SECTION</div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:.25rem .4rem;align-items:center;font-size:.56rem">
      <span class="chip yes">OWNER ✓</span><span>Someone the thing belongs to</span>
      <span class="chip yes">LOSS ✓</span><span>They no longer have it</span>
      <span class="chip yes">LAW ✓</span><span>A law names the taking as a crime</span></div>
    <div style="font-size:.46rem;margin-top:.3rem;color:#555">Each case has this strip. Watch which one changes.</div>
  </div>
  ${qrStrip(X,84,"#1d3b6a","#fff","#fff","Roboto",`Listen &amp; see the sources<br><b>Audio guide · Case 1</b>`,101)}`;
}

/* ============================================================
   CASE 2 · KLEPTOMANIA  (Victorian)
   ============================================================ */
function colKlepto(X) {
  const frame = (x,y,n,txt,inner) => `<div class="abs" style="left:${x}rem;top:${y}rem;width:6.2rem;height:6.4rem;background:#fbf8f0;border:.05rem solid #2f4a3a;overflow:hidden">
      <div class="abs" style="left:.1rem;top:.05rem;font-size:.28rem;font-weight:700;color:#8a5a2e">${n}</div>${inner}
      <div class="abs" style="left:0;right:0;bottom:0;background:rgba(47,74,58,.9);color:#f6efdf;font-size:.32rem;padding:.06rem .12rem;line-height:1.2">${txt}</div></div>`;
  return `
  <!-- K1 panel -->
  <div class="abs vic shadow vic-frame" style="left:${X}rem;top:11.5rem;width:${COLW}rem;height:26rem;padding:.8rem 1.1rem">
    <div class="orn" style="height:.95rem;margin:0 -.3rem .35rem"></div>
    <div class="kick">Section 1 · Case 2</div>
    <div class="dip" style="font-size:.78rem;line-height:1.2;margin:.15rem 0 .15rem">Kleptomania and Class</div>
    <div style="font-size:.44rem;font-style:italic;color:#8a5a2e;margin-bottom:.35rem;padding-bottom:.3rem;border-bottom:.04rem solid #c08a4f">Two shoplifters, one counter, two verdicts · Department stores in the United States and Britain, 1870s–1900s</div>
    ${KLE.map(p=>`<p>${p}</p>`).join("")}
    <div class="abs" style="left:1.1rem;right:1.1rem;bottom:.75rem;border-top:.05rem solid #2f4a3a;padding-top:.3rem">${conditions(true,true,true,"→ Thief: depends on who you are")}</div>
  </div>

  <!-- K2 two verdicts -->
  <div class="abs vic shadow" style="left:${X}rem;top:39rem;width:${COLW}rem;height:17rem;padding:.6rem .8rem">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:.05rem solid #2f4a3a;padding-bottom:.15rem">
      <div class="dip" style="font-size:.55rem">Same goods · Two verdicts</div><div class="kick" style="font-size:.32rem">Comparison</div></div>
    <div style="display:flex;gap:.5rem;margin-top:.4rem">
      <div style="flex:1;background:#fbf8f0;border:.05rem solid #c08a4f;padding:.4rem .5rem;height:10.6rem;position:relative">
        <div class="kick" style="font-size:.3rem">New York · 1882</div>
        <div style="font-size:.74rem;font-weight:700;margin:.1rem 0 .15rem">Ellen Sardy</div>
        <div style="font-size:.58rem;line-height:1.35">Caught with three pairs of hosiery and five pieces of silk. Her lawyer: she was ‘of weak mind’.</div>
        <div class="abs" style="left:.5rem;right:.5rem;bottom:.45rem;text-align:center"><div class="dip" style="font-size:.6rem;color:#2f6b3a">Kleptomania</div><div style="font-size:.52rem">She went free.</div></div>
      </div>
      <div style="flex:1;background:#fbf8f0;border:.05rem solid #c08a4f;padding:.4rem .5rem;height:10.6rem;position:relative">

/* ============================================================
   VIEWS
   ============================================================ */
const VIEWS = {
  board:    {x0:-.9, y0:-.9, w:121.8, h:91.8, s:14/R, html:()=>board(true), cap:"Whole board · Section 1"},
  ordinary: {x0:-.9, y0:-.9, w:31,   h:91.8, s:28/R, html:()=>board(true), cap:"Case 1 · Ordinary theft"},
  klepto:   {x0:29.8,y0:-.9, w:30.6, h:91.8, s:28/R, html:()=>board(true), cap:"Case 2 · Kleptomania and class"},
  robin:    {x0:59.7,y0:-.9, w:30.6, h:91.8, s:28/R, html:()=>board(true), cap:"Case 3 · Robbing the rich"},
  benin:    {x0:89.5,y0:-.9, w:31.4, h:91.8, s:28/R, html:()=>board(true), cap:"Case 4 · The Benin Bronzes"},
  desk:     {x0:-.5, y0:-1, w:121, h:62, s:14/R, html:()=>desk(true), cap:"Desk · top-down plan"},
  deskL:    {x0:-.5, y0:-1, w:61,  h:62, s:20/R, html:()=>desk(true), cap:"Desk · cases 1 and 2"},
  deskR:    {x0:59.5,y0:-1, w:61,  h:62, s:20/R, html:()=>desk(true), cap:"Desk · cases 3 and 4"},
  elev:     {w:180, h:200, s:7/R, html:()=>elevation(), cap:"Front elevation (assumed mounting heights)"},
};
function render(key) {
  const v = VIEWS[key]; const W = Math.round(v.w*v.s*R), H = Math.round(v.h*v.s*R);
  const ox = -(v.x0||0)*R*v.s, oy = -(v.y0||0)*R*v.s;
  return `<div class="view" style="width:${W}px;height:${H}px"><div class="stage" style="transform:translate(${ox}px,${oy}px) scale(${v.s})">${v.html()}</div></div>`;
}
const key = location.hash.slice(1);
const root = document.getElementById("root");
if (VIEWS[key]) root.innerHTML = render(key);
else root.innerHTML = Object.keys(VIEWS).map(k => `<div class="vcap">${VIEWS[k].cap}</div>${render(k)}`).join('<div style="height:30px"></div>');
</script>
