<style>

<body>

<script>
const R = 40;
const CW = 58.5, SW = 28.5;          // case column width, side width
const CX = [1, 60.5];                // case columns

/* ============================================================
   TEXT (Phase 4; three small grammar fixes noted in the summary)
   ============================================================ */
const INTRO = [
  "When land changes hands, the conflict begins long before the first surveyor’s peg or industrial excavator strikes the earth; it begins with language. Those in power wield bureaucratic terminology to sanitize dispossession. Communal heritage is branded “surplus,” ancestral forests are classified as “mine blocks,” and systemic exploitation is reframed under the banner of “development,” “national progress,” or “corporate stewardship.”",
  "This section sets state and corporate archives directly against the counter-archives preserved by indigenous communities. Comparing the 1887 Dawes Act in the United States with ongoing coal extraction in India’s Hasdeo Arand forest reveals identical institutional playbooks separated by over a century. Official records: statutes, clearance certificates, and glossy sustainability brochures, depict an orderly, legal redistribution of resources. In contrast, tribal petitions, forged consent controversies, and grassroots resistance tell a story of existential survival and broken treaties. By laying official claims alongside community realities, this exhibit asks: Who gets to decide what is legal, what is theft, and whose memory becomes history?"
];
const DAW = [
  "Before 1887, Native American tribes held and cared for their lands communally: no single person “owned” a plot; the entire tribe shared it. The U.S. government passed the Dawes General Allotment Act to end this system.",
  "The government surveyed reservations and split the shared land into small, individual private plots given to Native families. Any leftover territory was labeled “surplus” and sold off to non-Native settlers, railroads, and corporations.",
  "Under the guise of “civilizing” tribes through private ownership, this legal sleight of hand stripped Native Americans of roughly 90 million acres, two-thirds of their entire land base. The following exhibits trace how simple administrative labels transformed sacred communal homelands into commercial real estate, and how indigenous leaders fought to preserve their treaties."
];
const HAS = [
  "Spanning over 1650 square kilometres in Chhattisgarh, Hasdeo Arand is known as the “lungs of central India”, a biodiversity hotspot, elephant corridor, and home to indigenous Adivasi communities whose culture and survival rely on the forest. Under Indian law, village councils (Gram Sabhas) have the constitutional right to decide what happens to their ancestral land.",
  "Beneath this ancient canopy, however, lie billions of tons of coal. Over the past decade, state agencies and corporate developers have systematically cleared vast tracts of the forest, designating them as open-cast coal blocks.",
  "Official reports describe this extraction as essential national development and responsible stewardship. In response, local communities argue that clearances bypass their consent and destroy their watershed. The following exhibits document this unfolding clash: official environmental clearances and corporate brochures on one side, and village resolutions, forest blockades, and community defense on the other."
];

/* ============================================================
   HELPERS
   ============================================================ */
function qrBlock(size, seed) {
  let s = seed || 12345, cells = ""; const n = 21, c = size/n;
  const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) {
    const finder = (i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7); let on;
    if (finder) { const ii=i>13?i-14:i, jj=j>13?j-14:j; on = (ii==0||ii==6||jj==0||jj==6)||(ii>=2&&ii<=4&&jj>=2&&jj<=4); }
    else on = rnd()>0.52;
    if (on) cells += `<rect x="${j*c}" y="${i*c}" width="${c+.01}" height="${c+.01}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}rem" height="${size}rem"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#111">${cells}</g></svg>`;
}
function greyLines(n, gap, h, col) { let o=""; for (let i=0;i<n;i++) o += `<div style="height:${h}rem;margin-bottom:${gap}rem;width:${i%5==4?60:100}%;background:${col||'rgba(60,50,40,.26)'}"></div>`; return o; }
function tag(n, x, y) { return `<div class="anno" style="left:${x}rem;top:${y}rem">${n}</div>`; }
function leaf(x,y,rot,scale,col){ return `<svg class="abs" style="left:${x}rem;top:${y}rem;width:${2.2*scale}rem;height:${1.4*scale}rem;transform:rotate(${rot}deg)" viewBox="0 0 44 28">
  <path d="M2 14 H42" stroke="${col||'#3d5a2a'}" stroke-width="1.2"/>${[8,16,24,32].map(x=>`<ellipse cx="${x}" cy="8" rx="4" ry="2" transform="rotate(-35 ${x} 8)" fill="${col||'#3d5a2a'}"/><ellipse cx="${x+3}" cy="20" rx="4" ry="2" transform="rotate(35 ${x+3} 20)" fill="${col||'#3d5a2a'}"/>`).join("")}</svg>`; }
function label(cls, t, m, d) { return `<div class="${cls}"><div class="lt">${t}</div><div class="lm">${m}</div><div class="ld">${d}</div></div>`; }

function casePanel(X, num, title, sub, paras, offWords, comWords, accent) {
  return `
  <div class="abs neu shadow" style="left:${X}rem;top:11.5rem;width:${CW}rem;height:19.4rem;overflow:hidden">
    <div style="display:flex;height:3.6rem">
      <div style="width:3.6rem;background:${accent};color:#fff;font-family:'League Spartan';font-size:1.5rem;display:flex;align-items:center;justify-content:center">${num}</div>
      <div style="flex:1;padding:.5rem .9rem 0;border-bottom:.08rem solid ${accent}">
        <div class="cap" style="color:${accent}">Section 3 · Case ${num} · ${sub}</div>
        <div style="font-family:'Noticia Text';font-size:1.05rem;line-height:1.05;margin-top:.12rem">${title}</div></div>
    </div>
    <div style="padding:.5rem 1rem 0;column-count:2;column-gap:1.2rem">${paras.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="abs" style="left:1rem;right:1rem;bottom:.55rem;border-top:.05rem solid #bbb;padding-top:.25rem;display:flex;align-items:center;gap:.4rem">
      <div style="font-family:Montserrat;font-weight:700;font-size:.5rem;width:5.6rem;flex:none;line-height:1.15">SAME ACT,<br>TWO NAMES</div>
      <div style="flex:1">${offWords.map(w=>`<span class="word w-off">${w}</span>`).join("")}</div>
      <div style="font-family:Montserrat;font-weight:700;font-size:.5rem;color:#777">vs</div>
      <div style="flex:1;text-align:right">${comWords.map(w=>`<span class="word w-com">${w}</span>`).join("")}</div>
    </div>
  </div>
  <div class="abs side-head side-a shadow" style="left:${X}rem;top:32.4rem;width:${SW}rem;height:1.5rem">Side A · The official record</div>
  <div class="abs side-head side-b shadow" style="left:${X+30}rem;top:32.4rem;width:${SW}rem;height:1.5rem;justify-content:flex-end">The community’s record · Side B</div>
  <div class="abs" style="left:${X+28.75}rem;top:32.4rem;width:1rem;height:39rem;display:flex;flex-direction:column;align-items:center">
    <div style="width:.08rem;flex:1;background:repeating-linear-gradient(#5a4330 0 .4rem,transparent .4rem .7rem)"></div></div>`;
}

/* ============================================================
   CASE 1 · DAWES ACT
   ============================================================ */
function colDawes(X) {
  const A = X, B = X+30;
  return `
  ${casePanel(X,1,"The Dawes Act","Allotment of Native American land · United States, 1887–1934",DAW,
     ["“surplus”","allotment","“civilizing”","land for sale"],["treaty land","communal homeland","two-thirds lost"],"#2c3e5c")}

  <!-- D2 broadside -->
  <div class="abs vic shadow" style="left:${A}rem;top:34.6rem;width:${SW}rem;height:22.4rem;padding:.6rem;display:flex;gap:.6rem">
    <div style="position:relative;width:15rem;height:21.2rem;background:#f3ead2;border:.06rem solid #6b5a3a;padding:.6rem .5rem;text-align:center;flex:none">
      <div style="font-family:'Diplomata SC';font-size:.95rem;line-height:1.15;color:#1f1a14">INDIAN LAND<br>FOR SALE</div>
      <div style="height:.06rem;background:#1f1a14;margin:.3rem 0"></div>
      <div style="font-family:Georgia;font-weight:700;font-size:.7rem;line-height:1.1">GET A HOME<br>OF YOUR OWN</div>
      <div style="margin:.4rem auto;width:8rem;height:6.2rem;background:repeating-linear-gradient(135deg,#d9cba8 0 .25rem,#cbbb94 .25rem .5rem);border:.04rem solid #6b5a3a"></div>
      ${greyLines(8,.14,.14,'rgba(31,26,20,.35)')}
      <div class="note-ph" style="left:.15rem;bottom:.15rem">PLACEHOLDER · print the Library of Congress scan</div>
    </div>
    <div style="flex:1;padding-top:.2rem">
      <div class="orn" style="height:.6rem;margin-bottom:.35rem"></div>
      ${label("","“Indian Land for Sale” broadside","1911 · US Department of the Interior · Reproduction; original in the Library of Congress","A federal poster advertising 350,000 acres of allotted tribal land by sealed bid.")}
      <div class="dip" style="font-size:.52rem;margin-top:.8rem;line-height:1.5">The state<br>names it:<br><span style="color:#8a5a2e">for sale</span></div>
    </div>
  </div>

  <!-- D3 statute & rolls -->
  <div class="abs vic shadow" style="left:${A}rem;top:58.4rem;width:${SW}rem;height:12.8rem;padding:.55rem;display:flex;gap:.45rem">
    <div style="position:relative;width:7.2rem;height:11.7rem;background:#fbf8f0;border:.04rem solid #bbb;padding:.35rem;flex:none">
      <div style="font-family:Georgia;font-size:.32rem;text-align:center;font-weight:700;line-height:1.2">AN ACT to provide for the allotment of lands in severalty to Indians…</div>
      <div style="margin-top:.25rem">${greyLines(12,.1,.09)}</div>
      <div class="note-ph" style="left:.1rem;bottom:.1rem">statute · scan</div></div>
    <div style="position:relative;width:7.2rem;height:11.7rem;background:#fbf8f0;border:.04rem solid #bbb;padding:.35rem;flex:none">
      <div style="font-family:Georgia;font-size:.32rem;text-align:center;font-weight:700">FINAL ROLL</div>
      <div style="margin-top:.2rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.08rem">${Array.from({length:44},()=>`<div style="height:.18rem;background:rgba(60,50,40,.25)"></div>`).join("")}</div>
      <div class="note-ph" style="left:.1rem;bottom:.1rem">roll page · scan</div></div>
    <div style="flex:1">${label("","The Dawes Act and the allotment rolls","1887 and 1898–1914 · Reproductions; originals in the US National Archives","The statute that divided communal land into individual plots, and the rolls that decided belonging.")}</div>
  </div>

  <!-- D4 Cherokee memorials -->
  <div class="abs jour shadow" style="left:${B}rem;top:34.6rem;width:${SW}rem;height:12.8rem;padding:.55rem;display:flex;gap:.5rem">
    <div class="ph-box" style="width:12rem;height:11.7rem;background:#f7efe0;flex:none">Cherokee memorial to Congress<br>c.1900 · page scan</div>
    <div style="flex:1">${label("","Cherokee memorials to Congress","About 1900 · US Congressional Serial Set · Reproductions","Petitions from Cherokee delegates protesting allotment and defending communal landholdings.")}
      <div class="script" style="font-size:1.25rem;color:#6b3f17;margin-top:.5rem;line-height:1">The people name it</div></div>
  </div>

  <!-- D5 Redbird Smith -->
  <div class="abs jour shadow" style="left:${B}rem;top:48.8rem;width:${SW}rem;height:22.4rem;padding:.6rem">
    <div style="position:relative;background:#f7efe0;border-left:.25rem solid #6b3f17;padding:.6rem .7rem;height:9.6rem">
      <div style="font-family:Montserrat;font-weight:700;font-size:.32rem;letter-spacing:.1rem;color:#6b3f17">IN HIS OWN WORDS</div>
      <div style="font-size:.8rem;line-height:1.35;margin-top:.3rem;font-style:italic;color:#a33">[A single passage from Redbird Smith’s testimony refusing allotment, quoted exactly and attributed]</div>
      <div style="font-size:.52rem;margin-top:.4rem">— Redbird Smith, Cherokee (Keetoowah) leader, testimony to a US Senate select committee, 1906</div>
      <div class="note-ph" style="right:.15rem;bottom:.15rem">PLACEHOLDER · choose the passage from the Senate report</div>
    </div>
    <div style="display:flex;gap:.55rem;margin-top:.55rem">
      <div class="ph-box" style="width:9rem;height:9.6rem;background:#f7efe0;flex:none">Senate select committee report, 1906–07 · page with the testimony</div>
      <div style="flex:1">${label("","Testimony of Redbird Smith","November 1906 to January 1907 · US Senate select committee report · Reproduction","The recorded refusal of a Cherokee traditionalist leader who rejected individual allotment.")}</div>
    </div>
  </div>

  <!-- D6 shrinking land base -->
  <div class="abs neu shadow" style="left:${X}rem;top:72.8rem;width:44.5rem;height:15.6rem;padding:.6rem .8rem">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-family:'Noticia Text';font-size:.62rem;font-weight:700">The shrinking land base, 1887–1934</div>
      <div class="cap" style="color:#2c3e5c">Map</div></div>
    <div style="display:flex;gap:.8rem;margin-top:.4rem;align-items:flex-end">
      <div style="text-align:center"><div style="width:11.7rem;height:11.7rem;background:#6b3f17;opacity:.85;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Montserrat;font-weight:700;font-size:.55rem;line-height:1.3">1887<br>≈138 million acres</div></div>
      <div style="font-size:1.2rem;color:#555;padding-bottom:4rem">→</div>
      <div style="text-align:center;position:relative;width:11.7rem;height:11.7rem">
        <div class="abs" style="left:0;bottom:0;width:11.7rem;height:11.7rem;border:.08rem dashed #6b3f17"></div>
        <div class="abs" style="left:0;bottom:0;width:6.9rem;height:6.9rem;background:#6b3f17;opacity:.85;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Montserrat;font-weight:700;font-size:.42rem;line-height:1.3">1934<br>≈48 million</div>
        <div class="abs" style="right:.3rem;top:.4rem;font-family:Montserrat;font-weight:700;font-size:.45rem;color:#6b3f17;text-align:right">≈90 million<br>acres lost</div></div>
      <div style="flex:1;padding-bottom:.2rem">
        ${label("","The shrinking land base, 1887–1934 (map)","Made for this exhibition","Two maps comparing Native land in 1887 with the two-thirds lost by 1934.").replace('class=""','class="neu" style="background:none"')}
        <div class="note-ph" style="position:relative;display:inline-block;margin-top:.3rem">areas are to scale · replace with two dated maps; check acre figures</div></div>
    </div>
  </div>
  <div class="abs shadow" style="left:${X+46}rem;top:72.8rem;width:12.5rem;height:15.6rem;background:#2c3e5c;color:#e9eef6;padding:.7rem;text-align:center;font-family:Montserrat">
    <div style="display:inline-block;padding:.12rem;background:#fff">${qrBlock(6.6,501)}</div>
    <div style="font-size:.6rem;line-height:1.35;margin-top:.5rem">Listen &amp; see the sources<br><b>Audio guide · Case 1</b></div></div>`;
}

/* ============================================================
   CASE 2 · HASDEO ARAND
   ============================================================ */
function hasdeoMap() {
  // purely schematic: forest, coal blocks, villages (positions illustrative only)
  return `<svg viewBox="0 0 100 60" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect width="100" height="60" fill="#efe6d4"/>
    <path d="M8,10 C25,2 60,4 88,12 C96,25 92,48 75,55 C50,60 20,57 10,45 C3,35 3,20 8,10 Z" fill="#7d9b5f" opacity=".85"/>
    <path d="M18,30 C30,26 40,28 48,34 C44,44 30,46 20,42 Z" fill="#3a3a3a" opacity=".85"/>
    <path d="M55,16 C64,14 72,18 74,24 C68,30 58,29 54,24 Z" fill="#3a3a3a" opacity=".85"/>
    <path d="M58,38 C66,36 74,40 74,46 C67,50 60,49 57,44 Z" fill="#3a3a3a" opacity=".55" stroke="#3a3a3a" stroke-dasharray="1.5 1"/>
    <text x="33" y="38" font-size="2.6" font-family="Poppins" font-weight="700" fill="#fff" text-anchor="middle">coal block</text>

    <div class="abs" style="left:${bx+48.5}rem;top:${deskTop-2.5}rem;width:9rem;height:2.5rem;background:#8f8f8f;border-radius:1rem"></div>
    <div class="abs" style="left:${bx+65}rem;top:${deskTop-13}rem;width:10rem;height:13rem;background:#9a5a35;clip-path:polygon(8% 0,92% 0,80% 100%,20% 100%)"></div>
    <div class="abs" style="left:${bx+61}rem;top:${deskTop-34}rem;width:18rem;height:22rem;border-radius:50%;background:radial-gradient(circle,#4d7a35,#2f5a22)"></div>
    <div class="abs" style="left:${bx+82}rem;top:${deskTop-12}rem;width:8.5rem;height:12rem;background:linear-gradient(#cfdde4 0 20%,#7b5b3a 20%);border:.2rem solid rgba(220,230,235,.95);border-radius:.6rem"></div>
    <div class="abs" style="left:${bx+92.5}rem;top:${deskTop-12}rem;width:8.5rem;height:12rem;background:linear-gradient(#cfdde4 0 20%,#262626 20%);border:.2rem solid rgba(220,230,235,.95);border-radius:.6rem"></div>
    ${[0,60].map(o=>`<div class="abs" style="left:${bx+o+1}rem;top:${deskTop-.6}rem;width:38rem;height:.6rem;background:#c79f6e"></div>
       <div class="abs" style="left:${bx+o+31}rem;top:${deskTop-3.6}rem;width:6.4rem;height:3.6rem;background:#d9d3c7;border-radius:0 0 1.4rem 1.4rem"></div>`).join("")}
    <svg class="abs" style="left:136rem;top:${F-170}rem;width:46rem;height:170rem" viewBox="0 0 46 170">
      <g fill="#6f7a86"><ellipse cx="23" cy="11.5" rx="8" ry="11"/><rect x="19.5" y="21" width="7" height="5"/>
        <path d="M5 28 Q23 24 41 28 L45 92 L40 93 L36 46 L35 98 L34 168 L25 168 L23 104 L21 168 L12 168 L11 98 L10 46 L6 93 L1 92 Z"/></g></svg>

    ${[[0,"0"],[75,"75 cm desk top"],[90,"≈90 cm board bottom"],[180,"≈180 cm board top"],[155,"≈155 cm eye level"]].map(([h,t])=>`
      <div class="abs" style="left:0;top:${F-h}rem;width:${h==155?180:11}rem;border-top:.12rem ${h==155?'dashed #c0392b':'solid #333'}"></div>
      <div class="dim" style="left:${h==155?131:0.3}rem;top:${F-h-1.6}rem;font-size:1rem;${h==155?'color:#c0392b':''}">${t}</div>`).join("")}

/* ============================================================
   VIEWS
   ============================================================ */
const VIEWS = {
  board:  {x0:-.9, y0:-.9, w:121.8, h:91.8, s:14/R, html:()=>board(true), cap:"Whole board · Section 3"},
  dawes:  {x0:-.9, y0:-.9, w:61,   h:91.8, s:20/R, html:()=>board(true), cap:"Case 1 · The Dawes Act"},
  hasdeo: {x0:59.6,y0:-.9, w:61.4, h:91.8, s:20/R, html:()=>board(true), cap:"Case 2 · The Hasdeo Arand Forest"},
  desk:   {x0:-.5, y0:-1, w:121, h:62, s:14/R, html:()=>desk(true), cap:"Desk · top-down plan"},
  deskD:  {x0:-.5, y0:-1, w:61,  h:62, s:20/R, html:()=>desk(true), cap:"Desk · Dawes Act half"},
  deskH:  {x0:59.5,y0:-1, w:61,  h:62, s:20/R, html:()=>desk(true), cap:"Desk · Hasdeo Arand half"},
  elev:   {w:180, h:200, s:7/R, html:()=>elevation(), cap:"Front elevation (assumed mounting heights)"},
};
function render(key) {
  const v = VIEWS[key]; const W = Math.round(v.w*v.s*R), H = Math.round(v.h*v.s*R);
  const ox = -(v.x0||0)*R*v.s, oy = -(v.y0||0)*R*v.s;
  return `<div class="view" style="width:${W}px;height:${H}px"><div class="stage" style="transform:translate(${ox}px,${oy}px) scale(${v.s})">${v.html()}</div></div>`;
}
const key = location.hash.slice(1);
const root = document.getElementById("root");
if (VIEWS[key]) root.innerHTML = render(key);
else root.innerHTML = Object.keys(VIEWS).map(k => `<div class="vcap">${VIEWS[k].cap}</div>${render(k)}`).join('<div style="height:30px"></div>');
</script>
