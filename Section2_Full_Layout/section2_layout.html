<script>
const R = 40; // px per cm at stage scale 1

/* ============================================================
   TEXT
   ============================================================ */
const SECTION_INTRO = [
  "Most theft is easy to recognise. Something leaves its owner without permission, and the owner no longer has it. The three cases here are harder. In each, something small moved: seeds from a forest, blood from a village, photos from the internet. Yet it is hard to say what the owner lost. Brazil kept its rubber trees. The donors gave their blood willingly. The original photos stayed online.",
  "What changed was what each thing became: plantations on another continent, data for studies the donors say they never agreed to, a search engine for faces. Those who call these cases theft point to what the thing became, not only to what moved.",
  "The cases span 150 years, from the age of empire to the age of the internet. Each panel sets out what happened, who calls it theft and why, and how the other side answers."
];

// Story 1 — unchanged from the approved Rubber layout
const RUB_P1 = "In 1876, Henry Wickham, an Englishman living in the Amazon, shipped about 70,000 rubber seeds to Kew Gardens in London, paid by Britain’s India Office. By his own later account, he told customs they were “exceedingly delicate botanical specimens”. Brazil was then the world’s main source of rubber. The seedlings went on to British Asia. For twenty years little changed; then plantation labour, investment and the demand for bicycle and car tyres turned them into an industry. By 1913 Asian plantations had overtaken the Amazon, and Brazil’s rubber boom ended. Kerala’s rubber trees descend largely from the same seeds.";
const RUB_P2 = "In Brazil, Wickham is remembered as “the father of bio-piracy”: someone who profited from Brazil’s plants without its consent. Wickham called it patriotism. No Brazilian law in 1876 banned taking the seeds, Brazil kept its trees, and the plantations took decades of work to succeed. Britain knighted him in 1920.";

// Story 2 — Phase 4 text; one fix in the last paragraph
const HAV_P = [
  "The Havasupai are a Native American tribe of about 650 people, living deep in the Grand Canyon. From 1990, researchers from Arizona State University (ASU) collected blood from more than 200 members. Tribal leaders were told the study was about diabetes; the written consent form spoke more broadly, of “behavioral/medical disorders”.",
  "The samples were used in 23 papers and dissertations. Fifteen had nothing to do with diabetes; they covered schizophrenia, inbreeding and the tribe’s origins. One suggested its ancestors came from Asia, while the tribe’s own history says they began in the canyon. Tribal council member Carletta Tilousi said: “people got degrees and grants, and they never asked our permission.”",
  "The lead researcher defended the work as ethical: science often advances through studies not tied to one disease. In 2010, ASU’s governing board settled. It paid $700,000 to 41 tribe members, returned the samples and apologised. No court ever ruled on whether the research broke the law. The blood went home. The published papers did not."
];

// Story 3 — Phase 4 text, unchanged
const CLV_P = [
  "Clearview AI, an American company founded in 2017, copies publicly posted photos from social media, news sites and other websites, without telling the people in them. Its software turns each face into a faceprint, a list of numbers describing its geometry. One uploaded photo can then find other photos of the same face online. By its own count, it holds more than 100 billion images, and it sells searches mainly to police and government agencies.",
  "Regulators in Canada, Australia and several European countries found it broke their privacy laws. Canada’s privacy commissioner said: “What Clearview does is mass surveillance and it is illegal.” Illinois law draws its line at the faceprint: it protects scans of face geometry, but not photographs.",
  "Clearview’s co-founder, Hoan Ton-That, said: “All the data inside Clearview AI is publicly available, as it is with Google.” The company says police use it to identify suspects and abused children. It admits no wrongdoing, and has not paid several European fines."
];

const TIMELINE = [

  {y:1884, t:"1884", d:"Amazonas puts high export duties on rubber seeds.", ly:7.8},
  {y:1895, t:"1890s", d:"First commercial rubber plantings in Malaya.", ly:12.6},
  {y:1912, t:"1912", d:"Brazil passes the Rubber Defence Law.", ly:19.5},
  {y:1913, t:"1913", d:"Asian plantations overtake the Amazon.", ly:21.5},
  {y:1918, t:"1918", d:"Brazil bans the export of rubber seeds.", ly:23.5},
  {y:1920, t:"1920", d:"Wickham is knighted in Britain.", ly:25.5},
];

/* ============================================================
   SHARED HELPERS
   ============================================================ */
function qrBlock(size, seed) {
  let s = seed || 12345, cells = "";
  const n = 21, c = size/n;
  const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) {
    const finder = (i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);
    let on;
    if (finder) { const ii=i>13?i-14:i, jj=j>13?j-14:j;
      on = (ii==0||ii==6||jj==0||jj==6)||(ii>=2&&ii<=4&&jj>=2&&jj<=4); }
    else on = rnd()>0.52;
    if (on) cells += `<rect x="${j*c}" y="${i*c}" width="${c+.01}" height="${c+.01}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}rem" height="${size}rem"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#111">${cells}</g></svg>`;
}
function greyLines(n, w, gap, h, col) {
  let out = ""; for (let i=0;i<n;i++) out += `<div style="height:${h}rem;margin-bottom:${gap}rem;width:${(i%5==4? w*0.6 : w)}%;background:${col||'rgba(60,50,40,.28)'}"></div>`;
  return out;
}
function tag(n, x, y) { return `<div class="anno" style="left:${x}rem;top:${y}rem">${n}</div>`; }
function personSil(fill, x, y, h) { // simple head-and-shoulders silhouette for photo placeholders

    <circle cx="45" cy="34" r="19" fill="${fill}"/><path d="M8 100 Q10 62 45 60 Q80 62 82 100 Z" fill="${fill}"/></svg>`;
}

/* ============================================================

   ============================================================ */

  [[-77,8],[-80,9],[-83,9],[-85,11],[-85,14],[-83,15],[-80,10]],

  [[-17,15],[-17,21],[-13,28],[-6,36],[10,37],[11,33],[20,31],[32,31],[34,28],[43,12],[51,12],[44,-2],[40,-10],[40,-16],[35,-24],[33,-30],[16,-30],[12,-17],[13,-8],[9,-1],[9,4],[5,6],[-4,5],[-8,4],[-13,8]],
  [[44,-25],[47,-25],[50,-15],[49,-12],[44,-17]],
  [[-9,37],[-9,43],[-2,43.5],[-1,46],[-4.5,48],[2,51],[5,53],[8,54],[8.5,57],[12,56],[14,54],[20,54.5],[24,57],[23,60],[40,60],[40,45],[30,45],[28,41],[26,40],[23,36.5],[21,38],[19,42],[14,45],[12.5,44],[16,40],[18,40],[16,38],[12,38],[13,41],[10,44],[7,43.5],[3,43],[0,39],[-2,37]],
  [[-5.5,50],[1.5,51],[1.7,52.8],[0,54],[-1.5,55.5],[-2,57.5],[-4,58.6],[-5.5,57.5],[-5,55],[-3,54],[-3.2,53.3],[-4.6,52.8],[-5,51.7],[-3,51.4]],
  [[-6,52],[-6,54.5],[-8,55.3],[-10,54],[-10,51.8]],
  [[26,40],[28,41],[30,45],[40,45],[40,60],[115,60],[115,23],[110,20],[108,16],[109,12],[105,9],[103,10],[100,13],[99,8],[100,6],[103,1.5],[104,1.3],[102,3],[100.5,4.5],[98.5,8],[98,16],[94,17],[92,22],[88,22],[86,20],[80,15],[80,10],[77,8],[76,10],[73,16],[72,21],[68,24],[62,25],[57,26],[56,24],[59,22],[52,17],[44,12],[43,15],[39,21],[35,28],[34,28],[35,36],[36,36.5],[30,36.5],[27,37]],
  [[79.8,6],[80,9.8],[81.3,8.5],[81.8,7],[80.6,5.9]],
  [[95,5.5],[98,4],[104,-2],[106,-6],[102,-4],[99,0],[95.5,3]],
  [[109,1],[110,2],[113,3.5],[115,5],[115,-4],[110,-3]],
];
const SEED_ROUTE = [[-55.2,-2.9],[-54.7,-2.4],[-48.5,-1.4],[-40,8],[-25,28],[-12,45],[-3,53.4]];
const SEEDLING_ROUTE = [[-0.3,51.5],[-4,49],[-9.5,44],[-9.5,38],[-5.6,36],[5,37.5],[20,34],[32.3,31.3],[33,28],[38,21],[43.3,12.6],[52,12.5],[65,9],[79.8,6.9]];
const MALAYA_ROUTE = [[79.8,6.9],[86,5],[95,6],[99,4],[103.8,1.3]];
const PLACES = [
  {n:"Tapajós river", lo:-55.2, la:-2.9, dx:-1, dy:5, a:"end"},
  {n:"Belém", lo:-48.5, la:-1.4, dx:2, dy:-1.5, a:"start"},

  {n:"Malaya (Singapore)", lo:103.8, la:1.3, dx:1.5, dy:5.2, a:"end"},

function rubberMap() {
  const land = LAND.map(p => `<polygon points="${P(p)}" fill="#e3d4b0" stroke="#a8875a" stroke-width=".35"/>`).join("");
  const route = (pts, col, dash) => `<polyline points="${P(pts)}" fill="none" stroke="${col}" stroke-width="1.1" ${dash?'stroke-dasharray="2.4 1.6"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
  const places = PLACES.map(p => { const x=p.lo+85, y=60-p.la;
    return `<circle cx="${x}" cy="${y}" r="1.25" fill="#2f4a3a" stroke="#fff" stroke-width=".4"/>
      <text x="${x+p.dx}" y="${y+p.dy}" font-size="3.8" text-anchor="${p.a}" font-family="Unna, Georgia" font-weight="700" fill="#22332a">${p.n}</text>`; }).join("");

  const rose = `<g transform="translate(186,80)"><circle r="6" fill="none" stroke="#8a5a2e" stroke-width=".3"/>

  return `<svg viewBox="0 0 200 90" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

      <div class="abs" style="left:1.3rem;top:8.23rem;width:1rem;height:13.04rem;border-left:.06rem solid #c08a4f;border-top:.06rem solid #c08a4f;border-bottom:.06rem solid #c08a4f"></div>

    <!-- R3 BRITAIN'S VERDICT -->
    <div class="abs vic shadow vic-frame2" style="left:${X+1}rem;top:43rem;width:18.5rem;height:19rem;padding:1rem">
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:.05rem solid #2f4a3a;padding-bottom:.2rem">

      <div style="position:relative;margin-top:.45rem;height:8.6rem;background:#fbf8f0;border:.03rem solid #bbb;padding:.5rem .7rem">

    ${[0,40].map(o=>`<div class="abs" style="left:${bx+o+14}rem;top:${deskTop-8}rem;width:12rem;height:8rem;background:#1b1b1b"></div>`).join("")}
    <div class="abs" style="left:${bx+15.5}rem;top:${deskTop-9.2}rem;width:9rem;height:1.2rem;border:.15rem solid rgba(255,255,255,.8);background:rgba(255,255,255,.3)"></div>

    <div class="abs" style="left:${bx+84}rem;top:${deskTop-21.5}rem;width:32rem;height:20rem;background:#111;border-radius:.6rem .6rem .2rem .2rem;padding:.7rem"><div style="width:100%;height:100%;background:#0d1626 url('assets/video_frame_match.png') center/cover"></div></div>
    <div class="abs" style="left:${bx+82.5}rem;top:${deskTop-1.5}rem;width:35rem;height:1.5rem;background:#a9a9a9;border-radius:0 0 .4rem .4rem"></div>
    ${[0,40,80].map(o=>`<div class="abs" style="left:${bx+o+12}rem;top:${deskTop-5.6}rem;width:16rem;height:5.6rem;background:#f6efdf;border-top:.3rem solid ${['#2f4a3a','#b6a883','#d5b7a3'][o/40]}"></div>
      <div class="abs" style="left:${bx+o+27}rem;top:${deskTop-4}rem;width:7rem;height:4rem;background:#d9d3c7;border-radius:0 0 1.5rem 1.5rem"></div>
      <div class="abs" style="left:${bx+o+1}rem;top:${deskTop-.6}rem;width:38rem;height:.6rem;background:#c79f6e"></div>`).join("")}
    <svg class="abs" style="left:136rem;top:${F-170}rem;width:46rem;height:170rem" viewBox="0 0 46 170">
      <g fill="#6f7a86"><ellipse cx="23" cy="11.5" rx="8" ry="11"/><rect x="19.5" y="21" width="7" height="5"/>

/* ============================================================
   VIEWS
   ============================================================ */
const VIEWS = {
  board:     {x0:-.9, y0:-.9, w:121.8, h:91.8, s:14/R, html:()=>board(true), cap:"Whole board · Section 2 (1 cm = 14 px)"},
  rubber:    {x0:-.9, y0:-.9, w:43,   h:91.8, s:24/R, html:()=>board(true), cap:"Story 1 · Rubber column (1 cm = 24 px)"},
  havasupai: {x0:39.5,y0:-.9, w:41.5, h:91.8, s:24/R, html:()=>board(true), cap:"Story 2 · Havasupai column"},
  clearview: {x0:79.5,y0:-.9, w:42.4, h:91.8, s:24/R, html:()=>board(true), cap:"Story 3 · Clearview AI column"},
  desk:      {x0:-.5, y0:-1,  w:121,  h:62,   s:14/R, html:()=>desk(true),  cap:"Desk · top-down plan, all three stories"},
  deskH:     {x0:39.5,y0:-1,  w:41,   h:62,   s:24/R, html:()=>desk(true),  cap:"Desk · Havasupai third"},
  deskC:     {x0:79.5,y0:-1,  w:41.2, h:62,   s:24/R, html:()=>desk(true),  cap:"Desk · Clearview AI third"},
  elev:      {w:180, h:200, s:7/R, html:()=>elevation(), cap:"Front elevation (assumed mounting heights)"},
};
function render(key) {
  const v = VIEWS[key]; const W = Math.round(v.w*v.s*R), H = Math.round(v.h*v.s*R);
  const ox = -(v.x0||0)*R*v.s, oy = -(v.y0||0)*R*v.s;
  return `<div class="view" style="width:${W}px;height:${H}px">
    <div class="stage" style="transform:translate(${ox}px,${oy}px) scale(${v.s})">${v.html()}</div></div>`;
}
const key = location.hash.slice(1);
const root = document.getElementById("root");
if (VIEWS[key]) root.innerHTML = render(key);
else root.innerHTML = Object.keys(VIEWS).map(k => `<div class="vcap">${VIEWS[k].cap}</div>${render(k)}`).join('<div style="height:30px"></div>');
</script>
